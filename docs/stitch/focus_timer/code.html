bEM3AicnAjzF4wuj9yAawIHBz-s-kcdTEEDkSEsRtbAH6_GuHM0-jucJTXLDHcjD0enzhWC9qRAD-6J_ZGO-kcM-wdi3XXXiTw"/><span class="font-headline-sm text-headline-sm text-primary">HabitTrack</span><span class="text-outline-variant font-label-md text-label-md px-space-xs">/</span><span class="font-label-lg text-label-lg text-on-surface-variant truncate max-w-[130px]">My Habits</span></div><div class="flex items-center gap-space-xs"><button aria-label="Profile" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCf7Pdv4PR9ZD0bHmZ8zB8vK61w4QJZHxpyL7aSkZISWde5h4QU3REnUkW4ZUOM5oUks5OxB80KcMUGlSpBlS7yaMBPwuRWlh8jg50MA39Z-B08To2r3hmIDIF9Gjd1IbLeUIJu-TMs9eY-f2_DyxH5YnnD_j0xxL6IvCEHZtIQS9nU1GC2eUBGbw8WcjI0DdWY4L4mi7AJqLY6b1gaHs8Sa8uteCH2Zft1CXDofttuY_CrIICj0rlsEw"/></button></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-28 bg-surface"><div class="flex flex-col w-full max-w-[480px] mx-auto px-gutter py-space-md items-center justify-between min-h-[calc(100vh-8rem)]">
<!-- Subtle Ambient Top Context / Zen Pill -->
<div class="w-full flex justify-center pt-space-xs">
<div class="inline-flex items-center gap-space-xs bg-surface-container-low px-space-md py-1.5 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Deep Flow State</span>
</div>
</div>
<!-- Central Focus Stage: Dial & Countdown -->
<div class="w-full flex flex-col items-center justify-center my-auto py-space-lg">
<div class="relative flex items-center justify-center w-72 h-72 sm:w-80 sm:h-80">
<!-- Gentle ambient backdrop halo -->
<div class="absolute inset-4 rounded-full bg-secondary-container/20 blur-2xl pointer-events-none"></div>
<!-- Circular SVG Progress Ring -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 280 280">
<!-- Calming Background Track -->
<circle class="text-surface-container" cx="140" cy="140" fill="transparent" r="120" stroke="currentColor" stroke-width="12"></circle>
<!-- Active Progress Cyan/Teal Arc -->
<circle class="text-secondary-fixed-dim transition-all duration-1000 ease-linear" cx="140" cy="140" fill="transparent" id="progress-arc" r="120" stroke="currentColor" stroke-dasharray="753.98" stroke-dashoffset="196" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Central Countdown Numerals -->
<div class="absolute flex flex-col items-center justify-center text-center select-none">
<span class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold scale-125 sm:scale-150 py-1 transition-transform" id="timer-display">
          18:32
        </span>
<div class="flex items-center gap-1.5 mt-4">
<span class="material-symbols-outlined text-secondary text-[16px]">self_improvement</span>
<span class="font-label-md text-label-md text-on-surface-variant tracking-wide">Focus Session</span>
</div>
</div>
</div>
<!-- Mode Switchers / Subtle Duration Dots -->
<div class="flex items-center gap-space-xs mt-space-md p-1 bg-surface-container-lowest rounded-full shadow-sm">
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md bg-secondary-container text-on-secondary-container shadow-sm transition-colors" id="btn-mode-focus">
        25 min
      </button>
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" id="btn-mode-short">
        5 min
      </button>
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" id="btn-mode-long">
        15 min
      </button>
</div>
</div>
<!-- Bottom Control Deck & Session Stats -->
<div class="w-full flex flex-col items-center gap-space-lg pb-space-xs">
<!-- Action Pill Button Group -->
<div class="w-full flex items-center justify-center gap-space-sm px-space-xs">
<!-- Reset Button -->
<button aria-label="Reset Timer" class="flex-1 flex items-center justify-center gap-1.5 h-12 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface active:scale-95 transition-all" id="btn-reset">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span class="font-label-lg text-label-lg">Reset</span>
</button>

<span class="material-symbols-outlined text-[22px]" id="btn-toggle-icon">pause</span>

</button>
<!-- Soft Skip Button -->
<button aria-label="Skip to Next" class="flex-1 flex items-center justify-center gap-1.5 h-12 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface active:scale-95 transition-all" id="btn-skip">
<span class="material-symbols-outlined text-[20px]">skip_next</span>
<span class="font-label-lg text-label-lg">Skip</span>
</button>
</div>
<!-- Calm Mindful Stat Line -->
<div class="flex items-center gap-space-xs text-on-surface-variant bg-surface-container-lowest px-space-md py-2 rounded-full shadow-sm">
<span class="material-symbols-outlined text-secondary text-[18px]">task_alt</span>
<span class="font-body-md text-body-md">
<strong class="font-semibold text-on-surface">3 sessions</strong> completed today
      </span>
<span class="text-outline-variant font-label-sm text-label-sm">·</span>
<span class="font-label-sm text-label-sm text-secondary font-semibold">75m total</span>
</div>
</div>
</div>
<script>
  (function() {
    let totalSeconds = 25 * 60;
    let remainingSeconds = 18 * 60 + 32;
    let isRunning = true;
    let timerId = null;

    const display = document.getElementById('timer-display');
    const arc = document.getElementById('progress-arc');
    const btnToggle = document.getElementById('btn-toggle');
    const btnToggleIcon = document.getElementById('btn-toggle-icon');
    const btnToggleText = document.getElementById('btn-toggle-text');
    const btnReset = document.getElementById('btn-reset');
    const btnSkip = document.getElementById('btn-skip');

    const circumference = 2 * Math.PI * 120; // ~753.98

    function updateView() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      
      const progress = (totalSeconds - remainingSeconds) / totalSeconds;
      const offset = circumference * (1 - progress);
      arc.style.strokeDashoffset = offset;
    }

    function tick() {
      if (remainingSeconds > 0) {
        remainingSeconds--;
        updateView();
      } else {
        pauseTimer();
      }
    }

    function startTimer() {
      if (!timerId) {
        timerId = setInterval(tick, 1000);
        isRunning = true;
        btnToggleIcon.textContent = 'pause';
        btnToggleText.textContent = 'Pause';
      }
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      btnToggleIcon.textContent = 'play_arrow';
      btnToggleText.textContent = 'Start';
    }

    btnToggle.addEventListener('click', () => {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    btnReset.addEventListener('click', () => {
      pauseTimer();
      remainingSeconds = totalSeconds;
      updateView();
    });

    btnSkip.addEventListener('click', () => {
      pauseTimer();
      remainingSeconds = 0;
      updateView();
    });

    const modeButtons = [
      { id: 'btn-mode-focus', duration: 25 * 60 },
      { id: 'btn-mode-short', duration: 5 * 60 },
      { id: 'btn-mode-long', duration: 15 * 60 }
    ];

    modeButtons.forEach(mode => {
      const el = document.getElementById(mode.id);
      if (!el) return;
      el.addEventListener('click', () => {
        modeButtons.forEach(m => {
          const btn = document.getElementById(m.id);
          btn.className = 'px-4 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors';
        });
        el.className = 'px-4 py-1.5 rounded-full font-label-md text-label-md bg-secondary-container text-on-secondary-container shadow-sm transition-colors';
        totalSeconds = mode.duration;
        remainingSeconds = mode.duration;
        pauseTimer();
        updateView();
      });
    });

    // Start with default initial state
    updateView();
    startTimer();
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.04)]" data-active-classes="bg-secondary-container text-on-secondary-container font-label-sm shadow-[0_2px_8px_rgba(0,106,97,0.12)]"><div class="flex items-center justify-around h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] px-space-sm py-1 rounded-full text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[20px]">grid_view</span><span class="font-label-sm text-label-sm">Home</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] px-space-sm py-1 rounded-full transition-all gap-0.5 bg-secondary-container text-on-secondary-container font-label-sm shadow-[0_2px_8px_rgba(0,106,97,0.12)]" data-path="my-habits" href="#"><span class="material-symbols-outlined text-[20px]">task_alt</span><span class="font-label-sm text-label-sm">Habits</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] px-space-sm py-1 rounded-full text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="task-manager" href="#"><span class="material-symbols-outlined text-[20px]">checklist</span><span class="font-label-sm text-label-sm">Todos</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] px-space-sm py-1 rounded-full text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="focus-timer" href="#"><span class="material-symbols-outlined text-[20px]">timer</span><span class="font-label-sm text-label-sm">Timer</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] px-space-sm py-1 rounded-full text-on-surface-variant hover:text-on-surface transition-all gap-0.5" data-path="daily-reflection" href="#"><span class="material-symbols-outlined text-[20px]">book_2</span><span class="font-label-sm text-label-sm">Journal</span></a></div></nav></body></html>
