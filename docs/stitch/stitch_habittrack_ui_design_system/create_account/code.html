<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed-variant": "#005049", "surface": "#f9f9ff", "outline": "#707881", "primary-fixed": "#cce5ff", "on-primary-fixed": "#001d31", "on-secondary-container": "#006f66", "tertiary-fixed-dim": "#bfc8ce", "on-secondary": "#ffffff", "on-tertiary-container": "#fbfdff", "surface-container-low": "#f0f3ff", "primary-fixed-dim": "#93ccff", "surface-container-highest": "#d8e3fb", "surface-bright": "#f9f9ff", "primary-container": "#007bb9", "secondary-fixed-dim": "#6bd8cb", "on-primary-fixed-variant": "#004b73", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "on-error-container": "#93000a", "inverse-surface": "#263143", "background": "#f9f9ff", "secondary": "#006a61", "secondary-fixed": "#89f5e7", "surface-tint": "#006398", "surface-variant": "#d8e3fb", "surface-container-high": "#dee8ff", "inverse-on-surface": "#ecf1ff", "on-secondary-fixed": "#00201d", "surface-dim": "#cfdaf2", "surface-container": "#e7eeff", "outline-variant": "#bfc7d2", "on-primary-container": "#fdfcff", "tertiary-container": "#6d767b", "secondary-container": "#86f2e4", "on-surface-variant": "#3f4850", "error": "#ba1a1a", "on-surface": "#111c2d", "primary": "#006194", "on-background": "#111c2d", "on-tertiary": "#ffffff", "on-tertiary-fixed-variant": "#3f484d", "inverse-primary": "#93ccff", "tertiary": "#545d62", "error-container": "#ffdad6", "tertiary-fixed": "#dbe4ea", "on-error": "#ffffff", "on-tertiary-fixed": "#141d21" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-lg": "1.25rem", "space-xs": "0.25rem", "gutter": "1rem", "space-md": "1rem", "space-xl": "1.75rem", "margin": "1rem" }, fontFamily: { "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] }, fontSize: { "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}], "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600"}] } } } };</script></head><body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full items-center justify-center px-margin py-space-xl">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-lg shadow-xl p-space-lg sm:p-space-xl flex flex-col items-center">
<!-- App Branding -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="w-20 h-20 rounded-full bg-surface-container-low p-2 mb-space-sm flex items-center justify-center shadow-sm">
<img alt="HabitTrack brand mark" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1WLawR-00zDlOpSZlaPas0KLZ8KePvvMcZ4I3MUCuzch-Vuvu9lFMnsWSqOZM5P0v_2M5nTSdjzyZyZw6lp6CgknlQ_rJQcOfNh1X--SYAxCoByySQsXF9_RvWzkC9dCxLr5JiehD7GNXi66pdx9LGlmKq19bBhwXEcslob0wfgqV68YmkUKSAWZN6_bU9_xcOwK9x4SfgzXfahyzdbycMEbMWL76LQazela33Ko8vUlO2NeyhXDjCWpeI1"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-1">
        HabitTrack
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
        Build better days, one step at a time.
      </p>
</div>
<!-- Screen Title -->
<div class="w-full mb-space-lg">
<h2 class="font-headline-md text-headline-md text-on-surface text-center">
        Create Account
      </h2>
</div>
<!-- Sign Up Form -->
<form class="w-full flex flex-col gap-space-md" id="signup-form" onsubmit="event.preventDefault(); handleSignup();">
<!-- Username Field -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center w-full bg-surface-container-low rounded-full px-space-md py-3 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-primary text-xl select-none mr-3">
            person
          </span>
<input autocomplete="username" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="username-input" name="username" placeholder="Choose a username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center w-full bg-surface-container-low rounded-full px-space-md py-3 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-primary text-xl select-none mr-3">
            lock
          </span>
<input autocomplete="new-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none pr-8" id="password-input" name="password" placeholder="Create password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-outline hover:text-primary transition-colors flex items-center justify-center focus:outline-none" id="toggle-password-btn" onclick="toggleVisibility('password-input', 'password-eye-icon')" type="button">
<span class="material-symbols-outlined text-xl select-none" id="password-eye-icon">
              visibility_off
            </span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center w-full bg-surface-container-low rounded-full px-space-md py-3 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined text-primary text-xl select-none mr-3">
            lock_reset
          </span>
<input autocomplete="new-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none pr-8" id="confirm-password-input" name="confirm-password" placeholder="Confirm password" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-4 text-outline hover:text-primary transition-colors flex items-center justify-center focus:outline-none" id="toggle-confirm-password-btn" onclick="toggleVisibility('confirm-password-input', 'confirm-eye-icon')" type="button">
<span class="material-symbols-outlined text-xl select-none" id="confirm-eye-icon">
              visibility_off
            </span>
</button>
</div>
</div>
<!-- Submit Action Button -->
<div class="mt-space-sm">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary py-3.5 px-space-lg rounded-full font-label-lg text-label-lg shadow-md hover:shadow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2 group" id="submit-button" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-base group-hover:translate-x-1 transition-transform select-none">
            arrow_forward
          </span>
</button>
</div>
</form>
<!-- Navigation Alternate Flow Link -->
<div class="mt-space-xl flex items-center justify-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1.5" href="#">
<span>Already have an account?</span>
<span class="font-label-md text-label-md text-primary font-semibold hover:underline">Log in</span>
</a>
</div>
</div>
</div>
<script>
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function handleSignup() {
    const btn = document.getElementById('submit-button');
    if (!btn) return;
    
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.classList.add('opacity-90');
    btn.innerHTML = `
      <span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-on-primary border-t-transparent mr-2"></span>
      <span>Creating your routine...</span>
    `;

    setTimeout(() => {
      btn.innerHTML = `
        <span class="material-symbols-outlined text-base select-none">check_circle</span>
        <span>Welcome aboard!</span>
      `;
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-secondary');
    }, 1200);
  }
</script></main></body></html>
